<!DOCTYPE html>
<html lang=\"pl\">
<head>
    <meta charset=\"UTF-8\">
    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">
    <title>Moje Okazje</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f8fafc; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #1e293b; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-decoration: none; color: inherit; display: flex; flex-direction: column; transition: transform 0.2s, box-shadow 0.2s; border: 1px solid #e2e8f0; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 200px; object-fit: cover; background: #edf2f7; }
        .card-content { padding: 16px; display: flex; flex-direction: column; flex-grow: 1; }
        .card h3 { font-size: 16px; margin: 0 0 10px 0; color: #334155; line-height: 1.4; }
        .price { font-size: 18px; font-weight: bold; color: #dc2626; margin-bottom: 16px; }
        .btn { margin-top: auto; background: #2563eb; color: white; text-align: center; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 14px; transition: background 0.2s; }
        .card:hover .btn { background: #1d4ed8; }
    </style>
</head>
<body>
    <h1>Gorące Okazje</h1>
    <div class=\"grid\"><a href="[https://low-prices.eu/a/L9QL6UQGZuNu5PmR](https://low-prices.eu/a/L9QL6UQGZuNu5PmR)" target="_blank" class="card">
    <img src="https://img.eobuwie.cloud/product(b/d/b/6/bdb634a347e53f935227f090222dd7b666da617f_21_4066749842611_EK.jpg,webp)/sneakersy-adidas-campus-00s-j-hq6507-szary-0000303316181.webp" alt="Produkt">
    <div class="card-content">
        <h3>Buty Adidas Campus 00s</h3>
        <p class="price">349 zł</p>
        <span class="btn">Sprawdź okazję</span>
    </div>
</a></div>
</body>
</html>
